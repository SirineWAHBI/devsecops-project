repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: '(^\.vscode/|^tsconfig.*\.json$)'
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (memes regles que la CI)
        entry: C:/Users/wahbi/AppData/Local/Python/pythoncore-3.14-64/Scripts/semgrep.exe scan --config=semgrep-rules/no-eval.yml --config=p/owasp-top-ten --error --metrics=off
        language: system
        pass_filenames: false
        require_serial: true
        types_or: [ts, javascript, java]

      - id: gitleaks
        name: gitleaks (secrets dans les fichiers indexes)
        entry: C:/Users/wahbi/AppData/Local/Microsoft/WinGet/Packages/Gitleaks.Gitleaks_Microsoft.Winget.Source_8wekyb3d8bbwe/gitleaks.exe git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
        always_run: true
